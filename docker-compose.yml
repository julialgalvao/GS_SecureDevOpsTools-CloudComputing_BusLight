# BusLight - stack do MVP (app + nginx)
# Local:  docker compose up --build        -> http://localhost:8080 (HTTP_PORT=8080 no .env)
# Na EC2: o deploy usa a imagem publicada no GHCR (variável IMAGE) e a porta 80.

services:
  app:
    image: ${IMAGE:-buslight-app:local}
    build: .
    environment:
      SPTRANS_TOKEN: ${SPTRANS_TOKEN:-}
    restart: always
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    expose:
      - "8000"

  nginx:
    image: nginx:1.29-alpine
    depends_on:
      app:
        condition: service_healthy
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:?defina METRICS_TOKEN no .env}
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    restart: always
    security_opt:
      - no-new-privileges:true
