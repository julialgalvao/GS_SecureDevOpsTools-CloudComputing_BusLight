name: DevSecOps BusLight

# Roda a cada push e pull request. Só publica e faz deploy quando tudo passa na main.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devsecops-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. segredos vazados (token, chave, senha) no código ou no histórico
  gitleaks:
    name: Gitleaks (segredos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2. análise estática do código (SAST)
  semgrep:
    name: Semgrep (código vulnerável)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.185.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: semgrep scan --config p/security-audit --config p/python --config p/dockerfile --error --metrics=off

  # 3. testes automatizados da API
  testes:
    name: Testes (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  # 4. configuração insegura no Terraform e no Dockerfile
  iac:
    name: Trivy (Terraform e Dockerfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore

  # 5. Terraform formatado e válido, nas duas nuvens (não precisa de credencial)
  terraform:
    name: Terraform (fmt e validate)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        diretorio: [infra, infra-azure]
    defaults:
      run:
        working-directory: ${{ matrix.diretorio }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.2
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  # 6. build da imagem + CVE crítico com Trivy + publicação no GHCR
  imagem:
    name: Build e Trivy (imagem)
    needs: [gitleaks, semgrep, testes, iac, terraform]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      imagem: ${{ steps.nome.outputs.imagem }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: nome
        run: echo "imagem=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: ${{ steps.nome.outputs.imagem }}:${{ github.sha }}

      - name: Trivy na imagem
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.nome.outputs.imagem }}:${{ github.sha }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Login no GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imagem
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          docker tag "$IMAGEM:$GITHUB_SHA" "$IMAGEM:latest"
          docker push "$IMAGEM:$GITHUB_SHA"
          docker push "$IMAGEM:latest"
        env:
          IMAGEM: ${{ steps.nome.outputs.imagem }}

  # 6b. a stack inteira (app + nginx + node-exporter) sobe com docker compose e responde
  compose:
    name: Stack no docker compose
    runs-on: ubuntu-latest
    needs: testes
    env:
      HTTP_PORT: "8080"
      # o segredo vem do GitHub Secrets; sem ele (PR de fork) usa um valor só de teste
      METRICS_TOKEN: ${{ secrets.METRICS_TOKEN || 'token-de-teste' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Subir a stack
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Site e métricas respondem
        run: |
          curl -fsS http://127.0.0.1:8080/health
          curl -fsS http://127.0.0.1:8080/ | grep -q BusLight
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/metrics)" = "401"
          curl -fsS -H "Authorization: Bearer $METRICS_TOKEN" http://127.0.0.1:8080/metrics | grep -q http_
          curl -fsS -H "Authorization: Bearer $METRICS_TOKEN" http://127.0.0.1:8080/node-metrics | grep -q node_cpu

      - name: Derrubar
        if: always()
        run: docker compose down -v

  # 7. deploy automático. A EC2 não tem porta de administração (nem SSH), então o deploy é "pull":
  # o pipeline publica a imagem e a própria máquina (timer buslight-atualiza) baixa a versão nova.
  # O job só termina verde quando o /health da URL pública devolve o commit deste pipeline.
  deploy:
    name: Deploy na AWS
    needs: [imagem, compose]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-producao
    env:
      MVP_URL: ${{ vars.MVP_URL }}
      METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
    steps:
      - name: URL do MVP não configurada
        if: env.MVP_URL == ''
        run: echo "::notice::Variável MVP_URL não configurada, deploy pulado."

      - name: Esperar a EC2 rodar a versão nova
        if: env.MVP_URL != ''
        run: |
          for i in $(seq 1 40); do
            VERSAO=$(curl -fsS --max-time 5 "$MVP_URL/health" | jq -r .versao || true)
            echo "tentativa $i: no ar = ${VERSAO:-sem resposta}"
            if [ "$VERSAO" = "$GITHUB_SHA" ]; then
              echo "::notice::BusLight ${GITHUB_SHA::7} no ar em $MVP_URL"
              exit 0
            fi
            sleep 15
          done
          echo "::error::A EC2 não atualizou para ${GITHUB_SHA::7} em 10 minutos"
          exit 1

      - name: Teste de fumaça
        if: env.MVP_URL != ''
        run: |
          curl -fsS "$MVP_URL/api/resumo" > /dev/null
          curl -fsS "$MVP_URL/" | grep -q BusLight
          # as métricas só abrem com o token (GitHub Secret); sem ele a resposta é 401
          test "$(curl -s -o /dev/null -w '%{http_code}' "$MVP_URL/metrics")" = "401"
          if [ -n "$METRICS_TOKEN" ]; then
            curl -fsS -H "Authorization: Bearer $METRICS_TOKEN" "$MVP_URL/metrics" | grep -q http_
          fi
