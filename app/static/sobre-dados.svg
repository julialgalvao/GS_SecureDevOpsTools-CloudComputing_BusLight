<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-label="Do ônibus à nuvem e ao celular: os dados da SPTrans são coletados, tratados em camadas e mostrados no app">
<defs>
<linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EAF6F6"/><stop offset="1" stop-color="#F3F7FD"/></linearGradient>
<marker id="seta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#1F3A5F"/></marker>
</defs>
<rect width="640" height="440" rx="28" fill="url(#fundo)" stroke="#E1E7F0" stroke-width="2"/>

<g transform="translate(70 130)">
