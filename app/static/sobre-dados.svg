  <ellipse cx="65" cy="30" rx="60" ry="18" fill="#B87333"/><rect x="5" y="30" width="120" height="30" fill="#B87333"/><ellipse cx="65" cy="60" rx="60" ry="18" fill="#B87333"/>
  <ellipse cx="65" cy="76" rx="60" ry="18" fill="#9AA6B8"/><rect x="5" y="76" width="120" height="30" fill="#9AA6B8"/><ellipse cx="65" cy="106" rx="60" ry="18" fill="#9AA6B8"/>
  <ellipse cx="65" cy="122" rx="60" ry="18" fill="#FFD43B"/><rect x="5" y="122" width="120" height="30" fill="#FFD43B"/><ellipse cx="65" cy="152" rx="60" ry="18" fill="#FFD43B"/>
  <text x="65" y="56" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Brutos</text>
  <text x="65" y="102" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0E1F3D">Limpos</text>
  <text x="65" y="148" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0E1F3D">Prontos</text>
</g>
<text x="320" y="92" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F8B8D">2. Organizamos</text>

<g transform="translate(450 100)">
