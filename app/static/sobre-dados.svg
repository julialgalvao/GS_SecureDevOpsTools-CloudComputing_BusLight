<text x="510" y="92" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F8B8D">3. Mostramos</text>

<path d="M205 205 H245" stroke="#1F3A5F" stroke-width="3.5" stroke-dasharray="7 6" marker-end="url(#seta)" fill="none"/>
<path d="M395 205 H440" stroke="#1F3A5F" stroke-width="3.5" stroke-dasharray="7 6" marker-end="url(#seta)" fill="none"/>
<text x="320" y="385" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#5B6780">4 coletas por dia · dados conferidos antes de chegar ao app</text>
