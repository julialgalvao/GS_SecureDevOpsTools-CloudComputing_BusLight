<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-label="Telas do BusLight: mapa dos pontos coloridos pela espera e o aviso de a que horas sair de casa">
<defs>
<linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF8DB"/><stop offset="1" stop-color="#FDE8E8"/></linearGradient>
</defs>
<rect width="640" height="440" rx="28" fill="url(#fundo)" stroke="#E1E7F0" stroke-width="2"/>

<g transform="translate(120 40) rotate(-6 100 180)">
  <rect width="200" height="340" rx="28" fill="#0E1F3D"/>
