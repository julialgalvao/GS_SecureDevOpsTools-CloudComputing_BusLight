  <text x="100" y="60" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#FFFFFF">BusLight</text>
  <rect x="20" y="88" width="160" height="120" rx="12" fill="#CFE3D4"/>
  <path d="M30 190 C70 150 90 170 130 120 S170 110 172 98" stroke="#FFFFFF" stroke-width="6" fill="none" stroke-linecap="round"/>
  <circle cx="52" cy="170" r="7" fill="#1E7B3A"/><circle cx="82" cy="158" r="7" fill="#1E7B3A"/><circle cx="108" cy="140" r="7" fill="#B85C00"/><circle cx="132" cy="118" r="7" fill="#B85C00"/><circle cx="158" cy="108" r="8" fill="#B3261E"/>
  <rect x="20" y="218" width="160" height="40" rx="10" fill="#FFFFFF"/><rect x="28" y="228" width="70" height="8" rx="4" fill="#1F3A5F"/><rect x="28" y="242" width="44" height="6" rx="3" fill="#E1E7F0"/><rect x="132" y="230" width="40" height="18" rx="9" fill="#FBDAD7"/>
  <rect x="20" y="266" width="160" height="40" rx="10" fill="#FFFFFF"/><rect x="28" y="276" width="86" height="8" rx="4" fill="#1F3A5F"/><rect x="28" y="290" width="52" height="6" rx="3" fill="#E1E7F0"/><rect x="132" y="278" width="40" height="18" rx="9" fill="#DDF3E4"/>
</g>

<g transform="translate(330 100) rotate(5 100 160)">
