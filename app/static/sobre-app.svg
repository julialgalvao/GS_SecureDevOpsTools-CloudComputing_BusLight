  <rect x="10" y="30" width="180" height="46" rx="16" fill="#1F3A5F"/><rect x="10" y="60" width="180" height="16" fill="#1F3A5F"/>
  <text x="100" y="60" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#FFD43B">Saia de casa às...</text>
  <rect x="20" y="90" width="160" height="92" rx="12" fill="#EAF6F6"/><rect x="20" y="90" width="6" height="92" rx="3" fill="#0F8B8D"/>
  <text x="38" y="120" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#1F3A5F">Saia 7 min antes</text>
  <rect x="38" y="132" width="132" height="6" rx="3" fill="#C9D7EA"/><rect x="38" y="146" width="104" height="6" rx="3" fill="#C9D7EA"/><rect x="38" y="160" width="76" height="6" rx="3" fill="#C9D7EA"/>
  <rect x="20" y="194" width="160" height="30" rx="8" fill="#FFFFFF"/><text x="30" y="214" font-family="system-ui, sans-serif" font-size="11" fill="#14213D">7282-10</text><rect x="116" y="200" width="54" height="18" rx="9" fill="#FBDAD7"/><text x="143" y="213" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#B3261E">47 min</text>
  <rect x="20" y="230" width="160" height="30" rx="8" fill="#FFFFFF"/><text x="30" y="250" font-family="system-ui, sans-serif" font-size="11" fill="#14213D">8700-10</text><rect x="116" y="236" width="54" height="18" rx="9" fill="#FFE9CC"/><text x="143" y="249" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#B85C00">22 min</text>
  <rect x="62" y="268" width="76" height="24" rx="12" fill="#E8505B"/><text x="100" y="285" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Calcular</text>
